name: Uptime check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to check"
        required: false
        default: "https://forwarddeployed-sigma.vercel.app"
  pull_request:
    paths:
      - .github/workflows/uptime.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-check
  cancel-in-progress: false

env:
  BASE_URL: ${{ inputs.base_url || 'https://forwarddeployed-sigma.vercel.app' }}
  ISSUE_TITLE: "Uptime check failing"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage and a job page
        id: check
        run: |
          set -u
          base="${BASE_URL%/}"
          failures=()

          fetch() { # url outfile -> prints HTTP status (000 on network error)
            curl -sSL --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors \
              -A "forwarddeployed-uptime-check" -o "$2" -w '%{http_code}' "$1" 2>/dev/null || true
          }

          home_status=$(fetch "$base/" home.html)
          home_status=${home_status:-000}
          job_path=""
          if [ "$home_status" != "200" ]; then
            failures+=("Homepage $base/ returned HTTP $home_status")
          else
            links=$(grep -oE 'href="/jobs/[^"/]+/[^"]+"' home.html | sort -u | wc -l)
            total=$(grep -oE '[0-9,]+ roles' home.html | head -1 | tr -dc '0-9')
            echo "Homepage: HTTP 200, ${total:-?} roles, $links job links"
            if [ "$links" -eq 0 ] || [ "${total:-0}" -eq 0 ]; then
              failures+=("Homepage $base/ shows no roles (${total:-no} roles count, $links job links)")
            fi
            job_path=$(grep -oE 'href="/jobs/[^"/]+/[^"]+"' home.html | head -1 | sed -E 's/^href="|"$//g')
          fi

          if [ -z "$job_path" ]; then
            failures+=("No job page to check: homepage listed no job links")
          else
            job_status=$(fetch "$base$job_path" job.html)
            job_status=${job_status:-000}
            if [ "$job_status" != "200" ]; then
              failures+=("Job page $base$job_path returned HTTP $job_status")
            elif ! grep -q 'Apply at' job.html; then
              failures+=("Job page $base$job_path has no Apply link")
            else
              echo "Job page: HTTP 200, $job_path"
            fi
          fi

          {
            echo "### Uptime check: $base"
            if [ ${#failures[@]} -eq 0 ]; then
              echo "All checks passed."
            else
              printf -- '- %s\n' "${failures[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#failures[@]} -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            printf '::error::%s\n' "${failures[@]}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            { echo "details<<EOF_DETAILS"; printf -- '- %s\n' "${failures[@]}"; echo "EOF_DETAILS"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Open, update or close the uptime issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OK: ${{ steps.check.outputs.ok }}
          DETAILS: ${{ steps.check.outputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")

          if [ "$OK" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Recovered at $now: $BASE_URL homepage and job page are up again. [Run]($RUN_URL)"
            fi
            exit 0
          fi

          body=$(printf '%s is failing its uptime check.\n\n%s\n\nLast checked: %s ([run](%s)). This issue closes itself when the check passes again.\n' \
            "$BASE_URL" "$DETAILS" "$now" "$RUN_URL")
          if [ -z "$issue" ]; then
            gh issue create --title "$ISSUE_TITLE" --label bug --body "$body"
          else
            previous=$(gh issue view "$issue" --json body --jq .body)
            gh issue edit "$issue" --body "$body"
            if [[ "$previous" != *"$DETAILS"* ]]; then
              gh issue comment "$issue" --body "$(printf 'Failure changed at %s ([run](%s)):\n\n%s' "$now" "$RUN_URL" "$DETAILS")"
            fi
          fi

      - name: Fail the run if the site is down
        if: steps.check.outputs.ok != 'true'
        run: exit 1
